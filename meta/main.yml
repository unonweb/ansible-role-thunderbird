---
dependencies: []

galaxy_info:
  author: Udo Nonner
  description: Setup Thunderbird on Debian Linux
  license: MIT
  min_ansible_version: "2.9"
  platforms:
    - name: Debian
      versions:
        - trixie

argument_specs:
  main:
    options:

      thunderbird_install_opt_from:
        required: true
        type: str
        choices:
        - archive
        - url

      thunderbird_install_opt_state:
        type: str
        required: true
        choices:
        - present
        - absent
        - reinstall
      
      thunderbird_install_opt_url:
        type: str
        required: false

      thunderbird_install_flatpak_scope:
        type: str
        required: true
        choices:
        - system
        - user
