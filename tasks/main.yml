---
- name: thunderbird role
  tags:
    - thunderbird
  block:

  # flatpak
  - ansible.builtin.import_tasks: install_flatpak.yml

  # apt
  - ansible.builtin.import_tasks: install_apt.yml

  # opt
  - ansible.builtin.import_tasks: install_opt.yml

  # desktop
  - when: thunderbird_desktop_src != None
    name: Copy desktop file thunderbird.desktop
    become: true
    ansible.builtin.copy:
      src: "{{ thunderbird_desktop_src }}"
      dest: "{{ thunderbird_desktop_dst }}"
      owner: "{{ thunderbird_user if thunderbird_desktop_dst.startswith('/home/') else 'root' }}"
      group: "{{ thunderbird_user if thunderbird_desktop_dst.startswith('/home/') else 'root' }}"
      mode: u=rw,g=,o=r

  # copy user data
  - when: 
    - thunderbird_user != None
    - thunderbird_user_data != None
    ansible.builtin.import_tasks: copy_user_data.yml

   