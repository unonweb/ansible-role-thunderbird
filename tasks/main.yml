---
# NOTES
# -----
# Migrate from pre-exisiting non-flatpak installations:
# 
# cp -r ~/.thunderbird ~/.var/app/org.mozilla.Thunderbird/
# In case Thunderbird opens a new profile instead of the existing one, run:  
# flatpak run org.mozilla.Thunderbird -P
# then select the right profile and tick "_Use the selected profile without asking on startup_" box.

- name: thunderbird role
  tags:
    - thunderbird
  block:

  # flatpak
  - when: thunderbird_flatpak_state != None
    name: Flatpak org.mozilla.Thunderbird -> {{ thunderbird_flatpak_state }}
    become: true
    community.general.flatpak:
      name: org.mozilla.Thunderbird
      method: "{{ thunderbird_flatpak_scope }}" 
      state: "{{ thunderbird_flatpak_state }}"
  
  # apt
  - when: thunderbird_apt_state != None
    name: Apt thunderbird -> {{ thunderbird_apt_state }}
    become: true
    ansible.builtin.apt:
      name: thunderbird
      state: "{{ thunderbird_apt_state }}"

  # archive
  - when: thunderbird_archive_state != None
    block:

    # remove archive
    - when: thunderbird_archive_state == "absent" or thunderbird_archive_state == "reinstall"
      name: Remove {{ thunderbird_archive_dst }}
      become: true
      ansible.builtin.file:
        path: "{{ thunderbird_archive_dst }}"
        state: absent

    # install archive
    - when: thunderbird_archive_state == "present" or thunderbird_archive_state == "reinstall"
      block:

      # check dir
      - name: Check if {{ thunderbird_archive_dst }} already exists
        ansible.builtin.stat:
          path: "{{ thunderbird_archive_dst }}"
        register: __thunderbird_archive_dst
      
      # install archive
      - when: not __thunderbird_archive_dst.stat.exists
        name: Unarchive {{ thunderbird_archive }} to {{ thunderbird_archive_dst }} (only if dst does not exist)
        become: true
        ansible.builtin.unarchive:
          src: "{{ thunderbird_archive }}"
          dest: "/opt"
          creates: "{{ thunderbird_archive_dst.split('/')[-1] }}" # /opt/thunderbird -> thunderbird
          mode: o=rwx,g=,o=rx

  # copy user data
  - when: 
    - thunderbird_user != None
    - thunderbird_user_data != None
    block:

    # mkdir tmp
    - name: Mkdir tmp path {{ thunderbird_user_data_tmp }}
      ansible.builtin.file:
        state: directory
        owner: ansible
        group: ansible
        path: "{{ thunderbird_user_data_tmp }}"
        mode: u=rwx,g=rwx,o=
    
    # sync to tmp
    - name: Sync "{{ thunderbird_user_data }}" to "{{ thunderbird_user_data_tmp }}"
      become: false
      delegate_to: localhost
      ansible.builtin.command: /usr/bin/rsync --recursive -e ssh {{ thunderbird_user_data }}/ ansible@{{ inventory_hostname }}:{{ thunderbird_user_data_tmp }}

    # copy data (apt or archive)
    - when: thunderbird_flatpak_state == None
      vars:
        __thunderbird_data_dst: "/home/{{ thunderbird_user }}/.thunderbird"
      block:
      
      # cp
      - name: Copy {{ thunderbird_user_data_tmp }} to /home/{{ thunderbird_user }}/.thunderbird
        become: true
        ansible.builtin.command: "cp --recursive {{ thunderbird_user_data_tmp }}/. {{ __thunderbird_data_dst }}"
    
      # chown
      - name: Set owner of "{{ __thunderbird_data_dst }}
        become: true
        ansible.builtin.file:
          state: directory
          recurse: true
          path: "{{ __thunderbird_data_dst }}"
          owner: "{{ thunderbird_user }}"
          group: "{{ thunderbird_user }}"