---
thunderbird_user:
thunderbird_user_data:
thunderbird_user_data_tmp: /home/ansible/tmp/thunderbird

# INSTALL OPT
# ===========
thunderbird_install_opt_from: url
thunderbird_install_opt_state: present # present, absent, reinstall
thunderbird_install_opt_url: https://download.mozilla.org/?product=thunderbird-latest-SSL&os=linux64&lang=de
thunderbird_install_opt_archive:
thunderbird_install_opt_dst: "/home/{{ thunderbird_user }}/opt/thunderbird"
thunderbird_install_opt_exec: "{{ thunderbird_install_opt_dst }}/thunderbird"
thunderbird_install_opt_link: /usr/local/bin/thunderbird

# INSTALL FLATPAK
# ===============
thunderbird_install_flatpak_state:
thunderbird_install_flatpak_scope: system

# INSTALL APT
# ===========
thunderbird_install_apt_state:

# DESKTOP
# =======
thunderbird_desktop_src: desktop/thunderbird.desktop.j2
thunderbird_desktop_dst: "{{ '/home/' + thunderbird_user + '/.local/share/applications/thunderbird.desktop' if thunderbird_user != None else '/usr/share/applications/thunderbird.desktop' }}"

# SYSTEMD
# =======
# (user)
thunderbird_systemd_user_dir: /etc/systemd/user # "/home/{{ thunderbird_systemd_user }}/.config/systemd/user"
thunderbird_systemd_copy: []
thunderbird_systemd_template: []
thunderbird_systemd_reset: []
thunderbird_systemd_overrides: []
thunderbird_systemd_start: []
thunderbird_systemd_stop: []
thunderbird_systemd_enable: []
thunderbird_systemd_disable: []
thunderbird_systemd_mask: []
thunderbird_systemd_unmask: []

# CLEANUP
# =======
thunderbird_cleanup_remove_system_opt_installation: false